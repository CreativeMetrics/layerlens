<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>LayerLens</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="hdr">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 56 56" width="26" height="26">
            <rect x="3" y="3" width="50" height="50" rx="13" fill="#e5c614" />
            <path d="M28 12 L44 20 L28 28 L12 20 Z" fill="#2c2c2a" />
            <path d="M12 28 L28 36 L44 28" fill="none" stroke="#2c2c2a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
            <path d="M12 36 L28 44 L44 36" fill="none" stroke="#2c2c2a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="0.55" />
          </svg>
        </span>
        <span class="hdr-txt">
          <span class="hdr-name">LayerLens</span>
          <span class="hdr-sub">vedi dentro il tuo GTM</span>
        </span>
        <button id="open-settings" class="icon-btn" title="Impostazioni" aria-label="Impostazioni"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </header>

      <!-- MAIN VIEW -->
      <div id="view-main">
        <section class="card">
          <div class="row-between">
            <span class="muted" id="dl-status">Ricerca container…</span>
            <span class="badge" id="container-count" hidden>0</span>
          </div>
          <div class="containers" id="containers"></div>
          <div class="no-gtm" id="no-gtm" hidden>
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.56 3.69a9 9 0 0 0 -2.92 1.95"/><path d="M3.69 8.56a9 9 0 0 0 -.69 3.44"/><path d="M3.69 15.44a9 9 0 0 0 1.95 2.92"/><path d="M8.56 20.31a9 9 0 0 0 3.44 .69"/><path d="M15.44 20.31a9 9 0 0 0 2.92 -1.95"/><path d="M20.31 15.44a9 9 0 0 0 .69 -3.44"/><path d="M20.31 8.56a9 9 0 0 0 -1.95 -2.92"/><path d="M15.44 3.69a9 9 0 0 0 -3.44 -.69"/></svg>
            <span>Nessun GTM in questa pagina</span>
          </div>
          <button id="inspect-dl" class="btn-primary" disabled>
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 15m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"/><path d="M18.5 18.5l2.5 2.5"/><path d="M4 6h16"/><path d="M4 12h4"/><path d="M4 18h4"/></svg> Ispeziona dataLayer
          </button>
        </section>

        <section class="toggles">
          <label class="toggle">
            <input type="checkbox" id="qol_changes" />
            <span class="switch" aria-hidden="true"></span>
            <span class="toggle-txt">
              <span class="toggle-title">Miglioramenti interfaccia GTM</span>
              <span class="toggle-sub">Filtri, copia, etichette variabili</span>
            </span>
          </label>
          <label class="toggle">
            <input type="checkbox" id="block_page_change" />
            <span class="switch" aria-hidden="true"></span>
            <span class="toggle-txt">
              <span class="toggle-title">Blocca uscita accidentale</span>
              <span class="toggle-sub">Avvisa prima di lasciare la pagina</span>
            </span>
          </label>
        </section>

        <section class="settings" id="settings" hidden>
          <p class="muted small">Le etichette dei tipi di variabile si configurano direttamente nell'interfaccia di GTM, nella barra dei filtri.</p>
          <div class="settings-meta"><span>Versione</span><span id="ext-version">—</span></div>
        </section>
      </div>

      <!-- DATALAYER VIEW (in-flow, replaces main — never an overlay) -->
      <div id="view-dl" hidden>
        <div class="dl-head">
          <button id="dl-back" class="icon-btn" aria-label="Indietro"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l14 0"/><path d="M5 12l6 6"/><path d="M5 12l6 -6"/></svg></button>
          <span class="dl-title" id="dl-modal-title">dataLayer</span>
          <span class="badge" id="dl-count"></span>
          <label class="live-toggle" title="Mostra i nuovi push in tempo reale">
            <input type="checkbox" id="dl-live" />
            <span class="live-dot"></span> Live
          </label>
          <button id="dl-export" class="icon-btn" title="Esporta tutti i push come JSON" aria-label="Esporta"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/><path d="M7 11l5 5l5-5"/><path d="M12 4v12"/></svg></button>
        </div>
        <div class="dl-filter">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;color:var(--muted)"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="search" id="dl-filter-input" placeholder="Cerca evento, chiave o valore…" autocomplete="off" spellcheck="false" />
          <span class="dl-filter-count" id="dl-filter-count" style="display:none"></span>
          <div class="scope-toggle">
            <button id="scope-page" class="scope-btn scope-active">Pagina</button>
            <button id="scope-all" class="scope-btn">Storico</button>
          </div>
        </div>
        <div class="dl-body" id="dl-modal-body"></div>
      </div>

      <footer class="ftr"><span id="footer-version">LayerLens</span></footer>
    </main>
    <textarea id="clipboard-helper" class="visually-hidden" aria-hidden="true"></textarea>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
